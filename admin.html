<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | NOTE AND</title>
<style>
  :root{--navy:#1d3557;--navy-deep:#14263f;--line:#e7e5e0;--ink-soft:#666;--green:#2a7a4a;--red:#c0392b;}
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:#f7f7f5;margin:0;color:#1a1a1a;}
  .wrap{max-width:900px;margin:0 auto;padding:48px 20px;}
  .narrow{max-width:420px;}
  .back{display:inline-block;margin-bottom:18px;font-size:14px;color:var(--ink-soft);text-decoration:none;}
  .back:hover{color:var(--navy);}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
  h1{font-size:22px;margin:0;}
  .logout{font-size:14px;color:var(--ink-soft);cursor:pointer;background:none;border:none;text-decoration:underline;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .name{font-size:15.5px;font-weight:700;}
  .row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-top:6px;gap:10px;}
  .row span:last-child{color:#1a1a1a;text-align:right;}
  .divider{border-top:1px solid var(--line);margin:14px 0;}
  .field-label{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;display:block;}
  .field-row{margin-bottom:10px;}
  textarea.q-memo, select.q-status{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea.q-memo{min-height:52px;resize:vertical;}
  select.q-status{width:auto;}
  .items-table{width:100%;border-collapse:collapse;margin-bottom:6px;}
  .items-table th{font-size:11px;color:var(--ink-soft);text-align:left;padding:2px 4px 6px;font-weight:600;}
  .items-table td{padding:3px 4px;}
  .items-table input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:inherit;}
  .items-table input.item-qty, .items-table input.item-price{text-align:right;}
  .item-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;padding:4px 6px;}
  .add-item-btn{background:#eef2f7;color:var(--navy);font-size:12.5px;padding:7px 12px;margin-top:2px;}
  .add-item-btn:hover{background:#e2e8f0;}
  .total-line{text-align:right;font-size:14.5px;font-weight:700;margin:6px 0 14px;color:var(--navy);}
  .valid-days-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);}
  .valid-days-row input{width:60px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;text-align:right;}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  button{border:none;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;padding:10px 16px;transition:background .15s ease;}
  .btn-send{background:var(--navy);color:#fff;}
  .btn-send:hover{background:var(--navy-deep);}
  .btn-send:disabled{opacity:.5;cursor:default;}
  .sent-note{font-size:12.5px;color:var(--green);margin-top:8px;}
  .err-note{font-size:12.5px;color:var(--red);margin-top:8px;}
  .empty,.loading{text-align:center;color:var(--ink-soft);padding:60px 16px;line-height:1.7;}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px;}
  input.login-input{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;}
  .login-btn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
  .login-btn:hover{background:var(--navy-deep);}
  #login-msg{margin-top:12px;font-size:13.5px;min-height:18px;}
  .denied{text-align:center;padding:60px 16px;color:var(--ink-soft);line-height:1.8;}
</style>
</head>
<body>

<div class="wrap narrow" id="login-view" style="display:none;">
  <a class="back" href="/">← 홈으로</a>
  <div class="login-card">
    <h1 style="margin-bottom:22px;">관리자 로그인</h1>
    <input type="email" id="email" class="login-input" placeholder="관리자 이메일" autocomplete="email">
    <input type="password" id="password" class="login-input" placeholder="비밀번호" autocomplete="current-password">
    <button id="login-btn" class="login-btn">로그인</button>
    <p id="login-msg"></p>
  </div>
</div>

<div class="wrap" id="denied-view" style="display:none;">
  <div class="denied">
    관리자 계정으로만 접근할 수 있는 페이지예요.<br>
    <button class="logout" id="denied-logout-btn">다른 계정으로 로그인</button>
  </div>
</div>

<div class="wrap" id="admin-view" style="display:none;">
  <a class="back" href="/">← 홈으로</a>
  <header>
    <h1>진단 신청 관리</h1>
    <button class="logout" id="logout-btn">로그아웃</button>
  </header>
  <div id="list" class="loading">불러오는 중...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://oblreetsmbzurfmdskpl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_PxmipI1KWIgeMuwP-5Ci8Q_RZwtwo2c';
  const ADMIN_EMAIL = 'noteand.something@gmail.com';
  const STATUS_OPTIONS = ['검토중', '견적발송', '진행중', '완료'];

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView = document.getElementById('login-view');
  const deniedView = document.getElementById('denied-view');
  const adminView = document.getElementById('admin-view');
  const listEl = document.getElementById('list');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function won(n) {
    const num = Number(n) || 0;
    return (num < 0 ? '-' : '') + '₩' + Math.abs(num).toLocaleString('ko-KR');
  }

  function showView(view) {
    [loginView, deniedView, adminView].forEach(v => v.style.display = 'none');
    view.style.display = 'block';
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      showView(loginView);
      return;
    }
    if (session.user.email !== ADMIN_EMAIL) {
      showView(deniedView);
      return;
    }
    showView(adminView);
    await loadRequests();
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msgEl = document.getElementById('login-msg');
    if (!email || !password) {
      msgEl.style.color = '#c0392b';
      msgEl.textContent = '이메일과 비밀번호를 입력해주세요.';
      return;
    }
    msgEl.style.color = '#666';
    msgEl.textContent = '로그인 중...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      msgEl.style.color = '#c0392b';
      msgEl.textContent = error.message;
      return;
    }
    init();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    init();
  });
  document.getElementById('denied-logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    init();
  });

  async function loadRequests() {
    listEl.className = 'loading';
    listEl.textContent = '불러오는 중...';
    const { data, error } = await sb
      .from('diagnosis_requests')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      listEl.className = 'empty';
      listEl.textContent = '신청 내역을 불러오는 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.';
      return;
    }
    if (!data || data.length === 0) {
      listEl.className = 'empty';
      listEl.textContent = '아직 접수된 진단 신청이 없어요.';
      return;
    }

    listEl.className = '';
    listEl.innerHTML = data.map(row => renderCard(row)).join('');
    data.forEach(row => bindCard(row));
  }

  function itemRowHtml(item) {
    const name = item ? item.name : '';
    const qty = item ? item.qty : '';
    const price = item ? item.price : '';
    return `
      <tr class="item-row">
        <td><input type="text" class="item-name" placeholder="상품명" value="${esc(name)}"></td>
        <td style="width:70px;"><input type="number" class="item-qty" placeholder="수량" value="${esc(qty)}"></td>
        <td style="width:110px;"><input type="number" class="item-price" placeholder="단가" value="${esc(price)}"></td>
        <td style="width:30px;"><button type="button" class="item-remove" data-role="remove">✕</button></td>
      </tr>
    `;
  }

  function renderCard(row) {
    const statusOpts = STATUS_OPTIONS.map(s =>
      `<option value="${s}" ${row.status === s ? 'selected' : ''}>${s}</option>`
    ).join('');
    const items = Array.isArray(row.quote_items) && row.quote_items.length > 0 ? row.quote_items : [null];
    const itemsHtml = items.map(itemRowHtml).join('');
    return `
      <div class="card" data-id="${row.id}">
        <div class="top">
          <div>
            <div class="name">${esc(row.name)} · ${esc(row.product_type) || '굿즈 제작 문의'}</div>
            <div class="row"><span>연락처</span><span>${esc(row.phone)}</span></div>
            <div class="row"><span>이메일</span><span>${esc(row.email)}</span></div>
            <div class="row"><span>수량 / 예산</span><span>${esc(row.quantity) || '-'} / ${esc(row.budget) || '-'}</span></div>
            <div class="row"><span>참고사항</span><span>${esc(row.notes) || '-'}</span></div>
            <div class="row"><span>제출일</span><span>${new Date(row.created_at).toLocaleString('ko-KR')}</span></div>
          </div>
          <select class="q-status" data-role="status">${statusOpts}</select>
        </div>
        <div class="divider"></div>
        <span class="field-label">견적 항목</span>
        <table class="items-table" data-role="items-table">
          <thead><tr><th>상품명</th><th>수량</th><th>단가</th><th></th></tr></thead>
          <tbody data-role="items-body">${itemsHtml}</tbody>
        </table>
        <button type="button" class="add-item-btn" data-role="add-item">+ 항목 추가</button>
        <div class="total-line" data-role="total">합계 ${won(0)}</div>
        <div class="field-row">
          <span class="field-label">메모 (배송 일정, 조건 등 · 선택)</span>
          <textarea class="q-memo" data-role="memo" placeholder="선택 입력">${esc(row.quote_memo)}</textarea>
        </div>
        <div class="valid-days-row">
          <span>견적 유효기간 (발행일로부터)</span>
          <input type="number" data-role="valid-days" value="${row.quote_valid_days || 7}"> 일
        </div>
        <div class="actions">
          <button class="btn-send" data-role="send-btn">이 내용으로 견적 발송</button>
        </div>
        <div data-role="msg"></div>
        ${row.quote_sent_at ? `<div class="sent-note">✓ ${new Date(row.quote_sent_at).toLocaleString('ko-KR')}에 견적 발송됨</div>` : ''}
      </div>
    `;
  }

  function bindCard(row) {
    const card = document.querySelector(`.card[data-id="${row.id}"]`);
    if (!card) return;
    const statusEl = card.querySelector('[data-role="status"]');
    const itemsBody = card.querySelector('[data-role="items-body"]');
    const addItemBtn = card.querySelector('[data-role="add-item"]');
    const totalEl = card.querySelector('[data-role="total"]');
    const memoEl = card.querySelector('[data-role="memo"]');
    const validDaysEl = card.querySelector('[data-role="valid-days"]');
    const sendBtn = card.querySelector('[data-role="send-btn"]');
    const msgEl = card.querySelector('[data-role="msg"]');

    function recalcTotal() {
      let total = 0;
      itemsBody.querySelectorAll('.item-row').forEach(tr => {
        const qty = Number(tr.querySelector('.item-qty').value) || 0;
        const price = Number(tr.querySelector('.item-price').value) || 0;
        total += qty * price;
      });
      totalEl.textContent = `합계 ${won(total)}`;
    }

    function bindRow(tr) {
      tr.querySelectorAll('.item-qty, .item-price').forEach(el => el.addEventListener('input', recalcTotal));
      tr.querySelector('[data-role="remove"]').addEventListener('click', () => {
        if (itemsBody.querySelectorAll('.item-row').length <= 1) {
          tr.querySelectorAll('input').forEach(i => i.value = '');
        } else {
          tr.remove();
        }
        recalcTotal();
      });
    }
    itemsBody.querySelectorAll('.item-row').forEach(bindRow);
    recalcTotal();

    addItemBtn.addEventListener('click', () => {
      itemsBody.insertAdjacentHTML('beforeend', itemRowHtml(null));
      bindRow(itemsBody.lastElementChild);
    });

    // 상태만 바꿀 때는 바로 저장
    statusEl.addEventListener('change', async () => {
      const { error } = await sb
        .from('diagnosis_requests')
        .update({ status: statusEl.value })
        .eq('id', row.id);
      if (error) {
        msgEl.className = 'err-note';
        msgEl.textContent = '상태 변경에 실패했어요.';
      } else {
        msgEl.className = 'sent-note';
        msgEl.textContent = '상태가 변경되었어요.';
      }
    });

    sendBtn.addEventListener('click', async () => {
      const items = [];
      itemsBody.querySelectorAll('.item-row').forEach(tr => {
        const name = tr.querySelector('.item-name').value.trim();
        const qty = tr.querySelector('.item-qty').value;
        const price = tr.querySelector('.item-price').value;
        if (name) {
          items.push({ name, qty: Number(qty) || 0, price: Number(price) || 0 });
        }
      });
      const memo = memoEl.value.trim();
      const validDays = Number(validDaysEl.value) || 7;

      if (items.length === 0) {
        msgEl.className = 'err-note';
        msgEl.textContent = '견적 항목을 하나 이상 입력해주세요.';
        return;
      }

      sendBtn.disabled = true;
      msgEl.className = '';
      msgEl.style.color = '#666';
      msgEl.textContent = '발송 중...';

      // 1) 견적 항목/메모/유효기간 먼저 저장
      const { error: updateError } = await sb
        .from('diagnosis_requests')
        .update({ quote_items: items, quote_memo: memo || null, quote_valid_days: validDays })
        .eq('id', row.id);

      if (updateError) {
        sendBtn.disabled = false;
        msgEl.className = 'err-note';
        msgEl.textContent = '저장에 실패했어요. 다시 시도해주세요.';
        return;
      }

      // 2) 이메일(PDF 견적서) 발송 요청
      const { data: { session } } = await sb.auth.getSession();
      try {
        const res = await fetch('/api/send-quote', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ id: row.id }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || '발송 실패');
        msgEl.className = 'sent-note';
        msgEl.textContent = '견적서 PDF가 이메일로 발송되었어요!';
        statusEl.value = '견적발송';
      } catch (err) {
        msgEl.className = 'err-note';
        msgEl.textContent = err.message || '발송에 실패했어요.';
      } finally {
        sendBtn.disabled = false;
      }
    });
  }

  init();
</script>
</body>
</html>
